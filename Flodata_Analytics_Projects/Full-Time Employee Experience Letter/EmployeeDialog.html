<body>
  <? if (typeof docUrl !== 'undefined') { ?>
  <!-- HTML for EmployeeSuccessDialog -->

    onclick="google.script.host.close()">
    Open Document
  </a>
  <? } else { ?>
  <!-- HTML for EmployeeDialog -->
  <div class="form-container">
    <!-- Inline error message banner -->
    <div id="errorBanner" class="error-banner">
      Please Fill the Required Details
    </div>

    <div class="form-group">
      <label for="employeeId">Employee ID</label>
      <input type="text" id="employeeId" placeholder="Enter Employee ID (e.g., HRM78)"
        value="<?= typeof employeeId !== 'undefined' ? employeeId : '' ?>">
    </div>

    <div class="form-group">
      <label for="sendingDate">Date of Sending</label>
      <input type="date" id="sendingDate" value="<?= typeof defaultDate !== 'undefined' ? defaultDate : '' ?>">
    </div>

    <div class="form-group">
      <label for="authority">Authorized Name</label>
      <select id="authority">
        <option value="" disabled selected>Select Authorized Name</option>
        <option value="Vaibhav Gupta" <?=(typeof authority !=='undefined' && authority==='Vaibhav Gupta' ) ? 'selected'
          : '' ?>>Vaibhav Gupta</option>
        <option value="Ujjwal Gupta" <?=(typeof authority !=='undefined' && authority==='Ujjwal Gupta' ) ? 'selected'
          : '' ?>>Ujjwal Gupta</option>
      </select>
    </div>

    <div class="form-group">
      <label for="roles">Roles, Responsibilities & Contributions</label>
      <input type="text" id="roles" placeholder="Enter roles and responsibilities"
        value="<?= typeof roles !== 'undefined' ? roles : '' ?>">
    </div>

    <div class="btn-container">
      <button class="btn-cancel" onclick="google.script.host.close()">Cancel</button>
      <button class="btn-submit" onclick="submitForm()">Save Details</button>
    </div>
  </div>

  <script>
    function submitForm() {
      var errorBanner = document.getElementById('errorBanner');
      errorBanner.style.display = 'none'; // reset visibility

      var employeeId = document.getElementById('employeeId').value.trim();
      var sendingDate = document.getElementById('sendingDate').value.trim();
      var authority = document.getElementById('authority').value;
      var roles = document.getElementById('roles').value.trim();

      if (!employeeId || !sendingDate || !authority || !roles) {
        errorBanner.innerText = 'Please Fill the Required Details';
        errorBanner.style.display = 'block'; // display inline banner
        return;
      }

      google.script.run
        .withSuccessHandler(function () {
          google.script.host.close();
        })
        .withFailureHandler(function (err) {
          errorBanner.innerText = 'Error saving details: ' + err.message;
          errorBanner.style.display = 'block';
        })
        .saveEmployeeDetails(employeeId, sendingDate, authority, roles);
    }
  </script>
  <? } ?>
